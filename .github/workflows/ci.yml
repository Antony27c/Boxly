name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: boxly
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ENVIRONMENT: dev
      JWT_SECRET_KEY: ci-no-es-un-secreto-real-solo-para-tests-1234567890
      RATE_LIMIT_ENABLED: "false"
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/boxly
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Instalar dependencias
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Migraciones sobre Postgres
        working-directory: backend
        run: alembic upgrade head

      - name: Tests
        working-directory: backend
        run: python -m pytest -q

      - name: Ruff
        working-directory: backend
        run: ruff check .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      # --if-present: el script "lint" todavia no existe en package.json
      # (se agrega en la fase de calidad del frontend); cuando exista corre normal.
      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build

      - name: Tests
        run: npm test --if-present
