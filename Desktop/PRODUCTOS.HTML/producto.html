<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Online - Productos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .filtros {
            background-color: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }
        .filtro-grupo {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        select, input[type="text"], input[type="range"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .productos-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }
        .producto-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            transition: transform 0.2s;
        }
        .producto-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .producto-card h3 {
            margin-top: 0;
            color: #333;
        }
        .precio {
            font-weight: bold;
            color: #2a6496;
            font-size: 1.2em;
        }
        .categoria {
            color: #666;
            font-style: italic;
        }
        .sin-stock {
            opacity: 0.6;
            position: relative;
        }
        .sin-stock::after {
            content: "AGOTADO";
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: red;
            color: white;
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 0.8em;
        }
        .valor-rango {
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Nuestros Productos</h1>
    
    <div class="filtros">
        <div class="filtro-grupo">
            <label for="busqueda">Buscar por nombre:</label>
            <input type="text" id="busqueda" placeholder="Escribe el nombre del producto...">
        </div>
        
        <div class="filtro-grupo">
            <label for="categoria">Filtrar por categoría:</label>
            <select id="categoria">
                <option value="todas">Todas las categorías</option>
            </select>
        </div>
        
        <div class="filtro-grupo">
            <label for="precio-max">Precio máximo: <span id="valor-precio-max" class="valor-rango">$1000</span></label>
            <input type="range" id="precio-max" min="0" max="1000" value="1000" step="50">
        </div>
        
        <div class="filtro-grupo">
            <input type="checkbox" id="solo-stock" checked>
            <label for="solo-stock" style="display: inline;">Mostrar solo productos en stock</label>
        </div>
    </div>
    
    <div class="productos-container" id="productos-container">
     
    </div>

<script src="js/productos.js"></script>
</body>
</html>
