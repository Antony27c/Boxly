<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Boxly · Gestión para talleres mecánicos</title>
    <meta
      name="description"
      content="Sistema para talleres mecánicos: órdenes de trabajo, turnos, repuestos con stock y cobros en un solo lugar, con un portal donde el cliente sigue su auto y paga online."
    />
    <meta name="theme-color" content="#f1f2f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121418" media="(prefers-color-scheme: dark)" />
    <!-- Dominio provisorio: confirmar antes de publicar (canonical, og:url, og:image y sitemap). -->
    <link rel="canonical" href="https://boxly.com.ar/" />

    <!-- Para compartir (WhatsApp, redes): Open Graph y Twitter Card. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:site_name" content="Boxly" />
    <meta property="og:title" content="Boxly · Gestión para talleres mecánicos" />
    <meta
      property="og:description"
      content="Órdenes, turnos, repuestos y cobros en un solo lugar. Y un portal donde tu cliente sigue su auto."
    />
    <meta property="og:url" content="https://boxly.com.ar/" />
    <meta property="og:image" content="https://boxly.com.ar/og-boxly.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Boxly: todo el taller, de la recepción a la entrega." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Boxly · Gestión para talleres mecánicos" />
    <meta
      name="twitter:description"
      content="Órdenes, turnos, repuestos y cobros en un solo lugar. Y un portal donde tu cliente sigue su auto."
    />
    <meta name="twitter:image" content="https://boxly.com.ar/og-boxly.png" />
    <meta name="twitter:image:alt" content="Boxly: todo el taller, de la recepción a la entrega." />

    <!-- Datos estructurados. Sin precios (los planes los edita el superadmin) ni reseñas. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Boxly",
        "applicationCategory": "BusinessApplication",
        "applicationSubCategory": "Gestión de talleres mecánicos",
        "operatingSystem": "Web",
        "inLanguage": "es-AR",
        "url": "https://boxly.com.ar/",
        "image": "https://boxly.com.ar/og-boxly.png",
        "description": "Sistema para talleres mecánicos: órdenes de trabajo, turnos, repuestos con stock y cobros, con un portal para que el cliente siga su auto y pague online."
      }
    </script>
    <script>
      // Aplica el tema guardado antes del primer pintado (evita el destello claro).
      try {
        var t = localStorage.getItem('boxly.tema') || 'sistema'
        var oscuro = t === 'oscuro' || (t === 'sistema' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (oscuro) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
    <!-- Las fuentes (Archivo) las sirve la propia app vía @fontsource/archivo
         (src/main.jsx): nada de pedidos a servidores de fuentes de terceros,
         así no se expone la IP de los usuarios. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
