# Boxly en un VPS:  docker compose up -d --build
# Requiere un archivo .env en esta carpeta (ver .env.prod.example).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-boxly}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    environment:
      # IP real del visitante (auditoría y límites por IP): gunicorn/uvicorn solo
      # aceptan X-Forwarded-For de Caddy, que tiene IP fija en la red interna.
      # gunicorn exige IPs sueltas (no acepta redes CIDR). Ver docs/Despliegue.md.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-172.28.0.10}
    volumes:
      # UPLOADS_DIR = backend/uploads dentro del contenedor (/app)
      - uploads:/app/uploads
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  web:
    build:
      context: ./frontend
      args:
        # Vacío = la API se llama al mismo origen (lo enruta Caddy).
        # Solo cambiarlo si el frontend se sirviera desde otro dominio.
        VITE_API_URL: ${VITE_API_URL:-}
    restart: unless-stopped
    expose:
      - "80"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
    networks:
      default:
        # IP fija: es el único proxy en el que confía la API (FORWARDED_ALLOW_IPS).
        ipv4_address: 172.28.0.10

networks:
  default:
    # Subred fija para que la IP de Caddy no cambie entre reinicios.
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
